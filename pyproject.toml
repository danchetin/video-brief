[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-brief"
version = "0.1.0"
description = "Turn a video into a timestamped transcript and a structured brief (yt-dlp + whisper.cpp + optional LLM summary)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only; yt-dlp, ffmpeg and whisper.cpp are external tools

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-brief = "video_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
